[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag-backend"
version = "0.1.0"
description = "Enterprise RAG backend (FastAPI, front-back separated)"
requires-python = ">=3.12"
dependencies = [
    # Web / ASGI
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.9",
    # 配置 / 校验
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    # HTTP 客户端（关键路径异步）
    "httpx>=0.27.0",
    "requests>=2.31.0",
    # 向量库
    "qdrant-client>=1.13.0",
    # 文档解析
    "pymupdf>=1.26.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.5",
    "pandas>=2.0.0",
    "pdfplumber>=0.11.0",
    "jieba>=0.42.1",
    # 持久化（P3）
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.0",
    "alembic>=1.13.0",
    # 缓存 / 队列（P3 + P4）
    "redis>=5.0.0",
    "arq>=0.26",
    # 可观测
    "langfuse>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
